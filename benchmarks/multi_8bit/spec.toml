[meta]
name = "multi_8bit"
description = "8-bit multiplier using shift-and-add algorithm."
version = "1.0"
author = "User"

[parameter]
DATA_WIDTH_A = 8
DATA_WIDTH_B = 8
PRODUCT_WIDTH = 16

[interface]
A       = "input [7:0] - Multiplicand operand"
B       = "input [7:0] - Multiplier operand"
product = "output [15:0] - Product of A and B"

[internal]
multiplicand = "8-bit register used to hold operand A during iteration"
shift_count  = "4-bit counter for controlling left shift amount"
loop_index   = "Iteration variable (0..7) for scanning multiplier bits"

[operation]
trigger = "combinational (always @*)"
behavior = """
1. Initialize product = 0.
2. For each bit i in multiplier B (0 to 7):
   - If B[i] == 1, add (multiplicand << shift_count) to product.
   - Increment shift_count by 1.
3. After 8 iterations, product contains the full multiplication result.
"""

[assumptions]
unsigned_mode = "Operands A and B are treated as unsigned integers."
no_overflow   = "The 16-bit product width is sufficient for two 8-bit operands."

[assertions]
correctness = "For all inputs A, B in [0,255], product == A * B (integer multiplication)."
bit_growth  = "The product width must be >= DATA_WIDTH_A + DATA_WIDTH_B."

[testbench]
stimulus = """
- Case1: A=0x0F, B=0x02 → product=0x001E
- Case2: A=0xFF, B=0xFF → product=0xFE01
- Case3: A=0xAA, B=0x55 → product=0x38E6
"""
expected = """
- Verify product matches mathematical multiplication result.
- Verify intermediate shifting and accumulation steps follow shift-add algorithm.
"""